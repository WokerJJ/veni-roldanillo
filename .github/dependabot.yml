version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Menores y parches en un solo PR por ecosistema; las mayores llegan aparte
  # porque suelen pedir cambios de código, salvo las familias que solo
  # funcionan juntas. Dependabot asigna cada paquete al primer grupo que
  # coincide, por eso los grupos de mayores van antes.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Pest y sus plugins publican la mayor a la vez.
      pest-mayores:
        patterns: ["pestphp/*"]
        update-types: ["major"]
      composer-menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Vitest y el plugin de Vue dependen de la mayor de Vite.
      vite-mayores:
        patterns: ["vite", "vitest", "@vitejs/*"]
        update-types: ["major"]
      npm-menores:
        update-types: ["minor", "patch"]
