# Desarrollo local: se aplica solo con `docker compose up` en este directorio.
# Monta el código, usa la etapa dev del Dockerfile y publica db y meilisearch
# en 127.0.0.1 para las herramientas del equipo.

x-app-dev: &app-dev
  build:
    context: .
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: veni-roldanillo-app-dev
  # Un init como PID 1: sin él, la entrada del contenedor (PID 1) ignora el
  # SIGTERM de `docker compose stop` mientras instala las dependencias y Docker
  # agota el plazo de gracia antes de matarla.
  init: true
  # !override reemplaza el .env de solo lectura: key:generate necesita escribirlo.
  volumes: !override
    - .:/app
    # vendor/ fuera de la carpeta montada: leer sus miles de archivos a través
    # del montaje de Docker Desktop (Windows/macOS) hacía cada petición lentísima.
    - vendor:/app/vendor
    # Descargas de Composer: sobreviven aunque se borre el volumen vendor.
    - composer_cache:/var/cache/composer
  # Se escriben en cada petición (vistas compiladas y registros de Inertia
  # DevTools): en memoria, no a través del montaje. Se pierden cada vez que el
  # contenedor se detiene o se reinicia, y está bien: son regenerables.
  tmpfs:
    - /app/storage/framework/views:mode=1777
    - /app/storage/inertia-devtools:mode=1777

services:
  # Migra con el código montado antes de que arranquen los demás. Es el primer
  # contenedor en arrancar, así que también es el que instala las dependencias
  # en el volumen vendor cuando faltan.
  migrate:
    <<: *app-dev

  app:
    <<: *app-dev
    # El primer arranque descarga las dependencias al volumen vendor: más
    # margen antes de contar fallos del healthcheck, revisando cada 5 s para
    # marcarlo sano apenas responda. Ya sano, cada revisión arranca Laravel:
    # cada 30 s basta y el contenedor queda quieto en reposo.
    healthcheck:
      start_period: 120s
      start_interval: 5s
      interval: 30s

  worker:
    <<: *app-dev
    # queue:listen arranca Laravel de nuevo para cada trabajo: un cambio en un
    # job se ve en el siguiente, sin reiniciar (queue:work, el de producción,
    # carga el código una sola vez).
    command: ["php", "artisan", "queue:listen", "--tries=3"]
    # La revisión de producción busca queue:work en el PID 1; aquí el PID 1 es
    # el init y el comando es otro.
    healthcheck: !override
      disable: true

  scheduler:
    <<: *app-dev
    healthcheck: !override
      disable: true

  db:
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      # Crea la base de pruebas veni_test (tras 10_postgis.sh de la imagen).
      # Solo en desarrollo: el servidor no necesita la base de pruebas ni la
      # carpeta docker/.
      - ./docker/postgres/20-veni-test.sh:/docker-entrypoint-initdb.d/20-veni-test.sh:ro

  meilisearch:
    ports:
      - "127.0.0.1:${FORWARD_MEILISEARCH_PORT:-7700}:7700"

volumes:
  vendor:
  composer_cache:
