version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Menores y parches en un solo PR por ecosistema; las mayores llegan aparte
  # porque suelen pedir cambios de código.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer-menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    labels: ["type:chore", "area:deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-menores:
        update-types: ["minor", "patch"]
