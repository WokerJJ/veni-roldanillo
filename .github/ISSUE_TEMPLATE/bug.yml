name: Bug
description: Algo de la app o de los paneles no funciona como debería.
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Dispositivo, navegador e idioma
      placeholder: "Android 14, Chrome, ES"
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas o logs. Sin datos personales de clientes.
